---
- name: Ensure OpenBao facts (openbao_host/address for CIDR policy)
  ansible.builtin.include_tasks: ../../../k8s/openbao-ops/tasks/ensure_ready.yml

- name: Render RBAC ClusterRoles
  ansible.builtin.template:
    src: cluster-roles.yaml.j2
    dest: /tmp/k8s-cluster-roles.yaml
    mode: "0644"

- name: Apply RBAC ClusterRoles
  ansible.builtin.shell: |
    kubectl apply -f /tmp/k8s-cluster-roles.yaml
  changed_when: false

- name: Render Cilium webhook ingress policy
  ansible.builtin.template:
    src: cilium-allow-webhook.yaml.j2
    dest: /tmp/cilium-allow-webhook.yaml
    mode: "0644"

- name: Apply CiliumClusterwideNetworkPolicy allow-webhook-ingress
  ansible.builtin.shell: |
    kubectl apply -f /tmp/cilium-allow-webhook.yaml
  changed_when: false

- name: Render Cilium apiserver egress policy (ns baseline + intent label)
