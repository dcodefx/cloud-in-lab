    mode: "0644"
  when: enable_policy_fqdn_egress

- name: Apply CiliumNetworkPolicy FQDN egress
  ansible.builtin.shell: |
    kubectl apply -f /tmp/cilium-allow-fqdn-egress.yaml
  changed_when: false
  when: enable_policy_fqdn_egress

- name: Render Cilium OpenBao egress policy (self-service label)
  ansible.builtin.template:
    src: cilium-allow-openbao-egress.yaml.j2
    dest: /tmp/cilium-allow-openbao-egress.yaml
    mode: "0644"
  when: enable_openbao_egress_by_label

- name: Apply CiliumClusterwideNetworkPolicy OpenBao egress
  ansible.builtin.shell: |
    kubectl apply -f /tmp/cilium-allow-openbao-egress.yaml
  changed_when: false
  when: enable_openbao_egress_by_label

- name: Render Cilium default-deny-all policy (enforce last — after all allows)
  ansible.builtin.template:
    src: cilium-default-deny.yaml.j2
    dest: /tmp/cilium-default-deny.yaml
    mode: "0644"

- name: Apply CiliumClusterwideNetworkPolicy default-deny-all
  ansible.builtin.shell: |
    kubectl apply -f /tmp/cilium-default-deny.yaml
  changed_when: false

- name: Check Cluster Network Policy CRD exists
  ansible.builtin.shell: |
    kubectl get crd clusternetworkpolicies.policy.networking.k8s.io 2>/dev/null && echo "found" || echo "notfound"
  register: _kcnp_check
  changed_when: false
  failed_when: false

- name: Install Cluster Network Policy CRDs
  ansible.builtin.shell: |
    kubectl --request-timeout=30s apply --server-side --force-conflicts -f https://raw.githubusercontent.com/kubernetes-sigs/network-policy-api/refs/tags/v0.2.0/config/crd/standard/policy.networking.k8s.io_clusternetworkpolicies.yaml
  register: _kcnp_crd
  until: _kcnp_crd.rc == 0
  retries: 6
  delay: 10
  changed_when: false
  when: _kcnp_check.stdout != "found"

- name: Wait for Cluster Network Policy CRDs to be established
  ansible.builtin.shell: |
    kubectl wait --for=condition=Established crd/clusternetworkpolicies.policy.networking.k8s.io --timeout=60s
  register: _kcnp_est
  until: _kcnp_est.rc == 0
  retries: 6
  delay: 10
  changed_when: false

- name: Render upstream ClusterNetworkPolicy admin-deny-cloud-metadata (KCNP / v1alpha2)
  ansible.builtin.template:
    src: kcnp-admin-metadata-deny.yaml.j2
    dest: /tmp/kcnp-admin-metadata-deny.yaml
    mode: "0644"

- name: Apply ClusterNetworkPolicy admin-deny-cloud-metadata
  ansible.builtin.shell: |
    kubectl apply -f /tmp/kcnp-admin-metadata-deny.yaml
  changed_when: false

- name: Generate per-role kubeconfigs
  ansible.builtin.include_tasks: kubeconfigs.yml