---
- name: Pre-check & fix known_hosts (localhost, before any target connection)
  hosts: localhost
  gather_facts: false
  connection: local
  tasks:
    - name: Detect known_hosts issues for target hosts
      ansible.builtin.shell: |
        ip="{{ item }}"
        if ! ssh-keygen -F "$ip" >/dev/null 2>&1; then echo "NEEDS_FIX"; exit 0; fi
        for i in $(seq 1 3); do
          if output=$(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=5 -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no "$ip" true 2>&1); then
            echo "OK"; exit 0
          fi
          if echo "$output" | grep -q "Host key verification failed"; then echo "NEEDS_FIX"; exit 0; fi
          [ "$i" -lt 3 ] && sleep 2
        done
        echo "OK"
      loop: "{{ groups['all'] | reject('equalto', 'localhost') | list | map('extract', hostvars, 'ansible_host') | select('defined') | unique | list }}"
      register: _kh_check
      changed_when: false
      failed_when: false

    - name: Decide fix flag and collect affected hosts
      ansible.builtin.set_fact:
        _do_fix: "{{ (auto_fix_hostkeys | default(true)) | bool }}"
        _needs_fix: "{{ _kh_check.results | selectattr('stdout', 'equalto', 'NEEDS_FIX') | list | length > 0 }}"
        _affected: "{{ _kh_check.results | selectattr('stdout', 'equalto', 'NEEDS_FIX') | map(attribute='item') | list }}"

    - name: Ask to fix known_hosts (only if issue exists and not pre-decided)
      ansible.builtin.pause:
        prompt: >-
          known_hosts mismatch detected on some hosts (possible rebuild):
          {{ _affected | join(', ') }}.
          Clear known_hosts and accept the new key? (Enter=yes, Ctrl-C=abort)
      when:
        - auto_fix_hostkeys is not defined
        - _needs_fix

    - name: Fix known_hosts for affected hosts
      ansible.builtin.shell: |
        ip="{{ item }}"
        ssh-keygen -R "$ip" >/dev/null 2>&1 || true
        ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts 2>/dev/null
      loop: "{{ _affected }}"
      when:
        - _do_fix
        - _needs_fix
      changed_when: true
      retries: 3
      delay: 15

    - name: Abort if issues exist but not fixing
      ansible.builtin.fail:
        msg: >-
          known_hosts mismatch not fixed (auto_fix_hostkeys=false).
          Manual fix: ssh-keygen -R {{ _affected | join(' ; ssh-keygen -R ') }}
      when:
        - _needs_fix
        - not _do_fix

- name: Wait until SSH is ready on K8s VMs
  hosts: k8s_master:k8s_worker
  gather_facts: false
  tasks:
    - name: Wait for SSH connection (retry; cloud-init may still be running)
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120
