- name: Include OS-specific setup
  ansible.builtin.include_tasks: "os_{{ ansible_facts['os_family'] | lower }}.yml"

- name: Include install tasks
  ansible.builtin.include_tasks: install.yml

- name: Include configure tasks
  ansible.builtin.include_tasks: configure.yml

- name: Include systemd tasks
  ansible.builtin.include_tasks: systemd.yml

- name: Include init tasks
  ansible.builtin.include_tasks: init.yml

- name: Include bootstrap tasks (mounts + engine content, root once)
  ansible.builtin.include_tasks: bootstrap.yml

- name: Include backup tasks
  ansible.builtin.include_tasks: backup.yml
  when: openbao_backup_enabled
