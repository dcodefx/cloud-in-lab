---
# maintenance.yml — restic-based backup orchestration
#
#   Install / prerequisites (Garage2 CT setup via chef.sh, restic passwords,
#   inventory generation): see docs/tr/maintenance/maintenance.md — Restic mimarisi (§4)
#
#   Run:
#     ansible-playbook -i inventory/maintenance-<ctid>.ini.generated playbooks/maintenance.yml
#     (inventory generated by chef.sh via scripts/garage-setup/gen-maintenance-inventory.sh — never write it by hand)
#
# become: required for target-side root operations (systemd/, /etc, /usr/local);
# targets are remote hosts on the Proxmox internal network only (no local connection).
# Garage2 (garage-backup) is reached over ssh like any other host — no pct/CT id.

- import_playbook: pre/connect.yml
- import_playbook: pre/maintenance-env-check.yml

- name: tofu-lar maintenance — restic + systemd timers + monitoring
  hosts: all
  become: true
  roles:
    - role: ../roles/maintenance
      # Tek enable kontrolu burada; alt include'lar backup.enabled'e bakar,
      # task'larin kendisinde tekrar sart YOK (single-check prensibi).
      when: maintenance.enable
