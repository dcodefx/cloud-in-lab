---
- name: Deploy systemd service
  ansible.builtin.template:
    src: bao.service.j2
    dest: /etc/systemd/system/bao.service
    owner: root
    group: root
    mode: "0644"
  notify: restart openbao

- name: Enable and start bao
  ansible.builtin.systemd:
    name: bao
    state: started
    enabled: true
    daemon_reload: true
