---
- name: Set flat vars from nested structure
  ansible.builtin.set_fact:
    openbao_version: "{{ openbao.version }}"
    openbao_ip: "{{ hostvars[groups.openbao[0]].ansible_host | default(ansible_host) }}"
    openbao_port: "{{ openbao.port }}"
    openbao_cluster_port: "{{ openbao.cluster_port }}"
  changed_when: false

- name: Set OpenBao addresses from IP
  ansible.builtin.set_fact:
    openbao_api_addr: "https://{{ openbao_ip }}:{{ openbao_port }}"
    openbao_cluster_addr: "https://{{ openbao_ip }}:{{ openbao_cluster_port }}"
  changed_when: false

