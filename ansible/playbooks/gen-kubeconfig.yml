---
- import_playbook: pre/connect.yml

# gen-kubeconfig.yml
# Usage:
#   ansible-playbook playbooks/gen-kubeconfig.yml \
#     -e role=developer \
#     -e namespace=redis
#
#   ansible-playbook playbooks/gen-kubeconfig.yml \
#     -e cluster_role=pod-reader \
#     -e namespace=myapp \
#     -e sa_name=ci-user
#
# Parametreler:
#   role           - Aggregated rol adi (admin, developer, deployer, monitoring, viewer)
#   cluster_role   - Tekil ClusterRole adi (pod-reader, deployer, monitoring-reader, vb.)
#   namespace      - Hedef namespace (zorunlu)
#   sa_name        - ServiceAccount adi (opsiyonel, default: role veya cluster_role)
#   cluster_wide   - true ise ClusterRoleBinding (opsiyonel, default: false)

- name: Generate namespace-scoped kubeconfig
  hosts: k8s_master[0]
  become: false
  vars:
    # Kullanici bu parametrelerden birini vermeli
    role: "{{ role | default('') }}"
    cluster_role: "{{ cluster_role | default('') }}"
    namespace: "{{ namespace | default('') }}"
    sa_name: "{{ sa_name | default('') }}"
    cluster_wide: "{{ cluster_wide | default(false) }}"
  tasks:
    - name: Validate parameters
      ansible.builtin.fail:
        msg: >
          'role' or 'cluster_role' parameter is required.
          Usage:
            role=developer namespace=redis
            cluster_role=pod-reader namespace=myapp
      when: role == '' and cluster_role == ''

    - name: Validate namespace
      ansible.builtin.fail:
        msg: "'namespace' parameter is required."
      when: namespace == ''

    - name: Map aggregated role to ClusterRole
      ansible.builtin.set_fact:
        _target_role: "{{ 'aggregated-' + role if role != '' else cluster_role }}"
        _sa_name: "{{ sa_name if sa_name != '' else (role if role != '' else cluster_role) + '-' + namespace }}"

    - name: Generate kubeconfig
      ansible.builtin.include_role:
        name: ../roles/k8s/security
        tasks_from: gen-kubeconfig.yml
      vars:
        gen_kc_cluster_role: "{{ _target_role }}"
        gen_kc_namespace: "{{ namespace }}"
        gen_kc_sa_name: "{{ _sa_name }}"
        gen_kc_cluster_wide: "{{ cluster_wide }}"
