---
# ============================================
# Gateway: main-gateway (allowedRoutes: All)
# Tür: gateway.networking.k8s.io/v1 / Gateway
# Katman: Routing (Gateway API)
# ============================================
# Ne işe yarar:
#   Cluster'daki TÜM namespace'lerdeki HTTPRoute'ların
#   bu Gateway'e bağlanmasına izin verir.
#
# allowedRoutes.namespaces.from: All
#   - Herhangi bir namespace'teki developer
#     kendi HTTPRoute'unu oluşturup bu Gateway'e
#     parentRef ile bağlayabilir.
#   - En az kısıtlayıcı seçenek.
#   - Multi-tenant bir cluster'da dikkatli kullanılmalı.
#
# Kullanım:
#   - Küçük cluster'lar
#   - Tek ekip/tek uygulama
#   - Geliştirme ortamları
# ============================================

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main-gateway
  namespace: infra-system
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
