---
- name: Wait for API server readiness before Cilium deployment
  ansible.builtin.shell: |
    timeout 120 bash -c 'until kubectl --kubeconfig=/etc/kubernetes/admin.conf --request-timeout=10s get --raw=/healthz 2>/dev/null | grep -q ok; do sleep 5; done'
  changed_when: false

- name: Clean pending Helm releases and stuck upgrade jobs (Cilium)
  ansible.builtin.shell: |
    kubectl -n kube-system delete secret \
      -l "owner=helm,name=cilium,status=pending-install" --ignore-not-found
    kubectl -n kube-system delete job \
      -l "app.kubernetes.io/instance=cilium" --ignore-not-found 2>/dev/null
  changed_when: false
  failed_when: false

- name: Deploy Cilium CNI via Helm (idempotent upgrade — applies values drift)
  block:
    - name: Helm upgrade Cilium
      ansible.builtin.command:
        argv: >-
          {{ ['helm', 'upgrade', '--install', 'cilium', 'cilium/cilium',
              '--namespace', 'kube-system',
              '--values', '/tmp/cilium-values.yaml',
              '--version', cilium_version] }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: _cilium
      changed_when: _cilium.rc == 0
  rescue:
    - name: Helm lock cleanup — delete stuck release
      ansible.builtin.shell: |
        kubectl -n kube-system delete secret -l "owner=helm,name=cilium,status=pending-install" --ignore-not-found
      when: _cilium.stderr is search("another operation")
      changed_when: false

    - name: Helm lock cleanup — log and retry
      ansible.builtin.debug:
        msg: "Helm release lock 'cilium' cleared, retrying."
      when: _cilium.stderr is search("another operation")

    - name: Retry Helm upgrade Cilium
      ansible.builtin.command:
        argv: >-
          {{ ['helm', 'upgrade', '--install', 'cilium', 'cilium/cilium',
              '--namespace', 'kube-system',
              '--values', '/tmp/cilium-values.yaml',
              '--version', cilium_version] }}
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: _cilium_retry
      changed_when: _cilium_retry.rc == 0
      when: _cilium.stderr is search("another operation")

- name: Wait for Cilium agent DaemonSet to become ready
  ansible.builtin.command:
    cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf --request-timeout=10s -n kube-system rollout status daemonset/cilium --timeout=180s
  register: _cilium_rollout
  until: _cilium_rollout.rc == 0
  retries: 3
  delay: 30
  changed_when: false

- name: Ensure CNI binary directories exist
  ansible.builtin.file:
    path: "{{ item[1] }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ groups['k8s_cluster'] | product(['/usr/lib/cni', '/opt/cni/bin']) | list }}"
  delegate_to: "{{ item[0] }}"
