---
# gen-kubeconfig.yml
# Reusable task: verilen ClusterRole + namespace icin kubeconfig uretir.
#
# Gerekli degiskenler:
#   gen_kc_cluster_role   - ClusterRole adi (orn: aggregated-developer, pod-reader)
#   gen_kc_namespace      - Hedef namespace (orn: redis, monitoring)
#
# Opsiyonel degiskenler:
#   gen_kc_sa_name        - ServiceAccount adi (default: gen_kc_cluster_role ile ayni)
#   gen_kc_filename       - Cikti dosyasi yolu (default: <repo>/ansible/outputs/k8s/<sa_name>.conf)
#   gen_kc_cluster_wide   - true ise ClusterRoleBinding, false ise RoleBinding (default: false)
#   gen_kc_context_name   - kubeconfig context adi (default: gen_kc_sa_name)

- name: "gen-kubeconfig - Set defaults"
  ansible.builtin.set_fact:
    gen_kc_sa_name: "{{ gen_kc_sa_name | default(gen_kc_cluster_role) }}"
    gen_kc_context_name: "{{ gen_kc_sa_name }}"
    gen_kc_cluster_wide: "{{ gen_kc_cluster_wide | default(false) }}"
    gen_kc_output_dir: "{{ playbook_dir | dirname }}/outputs/k8s"

- name: "gen-kubeconfig - Get cluster API server URL"
  ansible.builtin.shell:
    cmd: kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}'

  register: _api_server
  changed_when: false

- name: "gen-kubeconfig - Get cluster CA certificate"
  ansible.builtin.shell:
    cmd: kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}'

  register: _ca_b64
  changed_when: false

- name: "gen-kubeconfig - Get cluster name"
  ansible.builtin.shell:
    cmd: kubectl config view --raw --minify -o jsonpath='{.clusters[0].name}'

  register: _cluster_name
  changed_when: false

- name: "gen-kubeconfig - Ensure outputs directory exists"
  ansible.builtin.file:
    path: "{{ gen_kc_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: "gen-kubeconfig - Ensure namespace exists"
  ansible.builtin.shell: |
    kubectl create namespace {{ gen_kc_namespace }} --dry-run=client -o yaml | kubectl apply -f -

  changed_when: false

- name: "gen-kubeconfig - Create ServiceAccount"
  ansible.builtin.shell: |
    kubectl create serviceaccount {{ gen_kc_sa_name }} -n {{ gen_kc_namespace }} --dry-run=client -o yaml | kubectl apply -f -

  changed_when: false

- name: "gen-kubeconfig - Create token secret"
  ansible.builtin.shell: |
    kubectl apply -f - <<EOF
    apiVersion: v1
    kind: Secret
    metadata:
      name: {{ gen_kc_sa_name }}-token
      namespace: {{ gen_kc_namespace }}
      annotations:
        kubernetes.io/service-account.name: {{ gen_kc_sa_name }}
    type: kubernetes.io/service-account-token
    EOF

  changed_when: false

- name: "gen-kubeconfig - Create binding (RoleBinding or ClusterRoleBinding)"
  ansible.builtin.shell: |
    {% if gen_kc_cluster_wide %}
    kubectl create clusterrolebinding {{ gen_kc_sa_name }}-{{ gen_kc_cluster_role }} \
      --clusterrole={{ gen_kc_cluster_role }} \
      --serviceaccount={{ gen_kc_namespace }}:{{ gen_kc_sa_name }} \
      --dry-run=client -o yaml | kubectl apply -f -
    {% else %}
    kubectl create rolebinding {{ gen_kc_sa_name }}-{{ gen_kc_cluster_role }} \
      --clusterrole={{ gen_kc_cluster_role }} \
      --serviceaccount={{ gen_kc_namespace }}:{{ gen_kc_sa_name }} \
      --namespace={{ gen_kc_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
    {% endif %}

  changed_when: false

- name: "gen-kubeconfig - Get token"
  ansible.builtin.shell: |
    kubectl get secret {{ gen_kc_sa_name }}-token -n {{ gen_kc_namespace }} -o jsonpath='{.data.token}' | base64 -d

  register: _token
  changed_when: false
  no_log: true

- name: "gen-kubeconfig - Write kubeconfig"
  ansible.builtin.copy:
    content: |
      apiVersion: v1
      kind: Config
      current-context: {{ gen_kc_context_name }}
      clusters:
      - cluster:
          certificate-authority-data: {{ _ca_b64.stdout }}
          server: {{ _api_server.stdout }}
        name: {{ _cluster_name.stdout }}
      contexts:
      - context:
          cluster: {{ _cluster_name.stdout }}
          user: {{ gen_kc_sa_name }}
        name: {{ gen_kc_context_name }}
      users:
      - name: {{ gen_kc_sa_name }}
        user:
          token: {{ _token.stdout }}
    dest: "{{ gen_kc_filename | default(gen_kc_output_dir + '/' + gen_kc_sa_name + '.conf') }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: "gen-kubeconfig - Result"
  ansible.builtin.debug:
    msg: "Kubeconfig: {{ gen_kc_filename | default(gen_kc_output_dir + '/' + gen_kc_sa_name + '.conf') }} | ClusterRole: {{ gen_kc_cluster_role }} | Namespace: {{ gen_kc_namespace }} | Scope: {{ 'cluster' if gen_kc_cluster_wide else 'namespace' }}"
