---
- name: Install common packages (RedHat)
  ansible.builtin.dnf:
    name: "{{ packages_common_redhat }}"
    state: present

- name: Disable swap
  ansible.builtin.shell: |
    swapoff -a
    sed -i '/\sswap\s/d' /etc/fstab
  changed_when: false

- name: Disable firewalld
  ansible.builtin.service:
    name: firewalld
    state: stopped
    enabled: false
  failed_when: false
